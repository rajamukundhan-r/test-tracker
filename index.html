<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e0f11">
<title>Calorie Tracker</title>
<style>
:root{
  --bg:#0e0f11; --s1:#16181c; --s2:#1d2025; --line:#272a30;
  --text:#e8e9ec; --muted:#8b909a; --accent:#7ee0a1; --warn:#f5b66b; --bad:#ff7a7a;
  --p:#6aa9ff; --c:#f5c26b; --f:#ff8fb1;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app{max-width:760px;margin:0 auto;padding:18px 16px}
h1{font-size:20px;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:12px;margin:22px 0 10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:12px}
.grid>.card{margin-top:0}
.muted{color:var(--muted)} .sm{font-size:12.5px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.nav{display:flex;align-items:center;gap:6px}
.ib{background:var(--s1);border:1px solid var(--line);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-size:16px}
.ib:hover{background:var(--s2)}
.btn{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.btn:hover{border-color:#3a3e46}
.btn.pri{background:var(--accent);color:#08110b;border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.block{width:100%;padding:12px}
input,select{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:480px){.g4{grid-template-columns:1fr 1fr}}
.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1}
.macros{flex:1;display:grid;gap:11px}
.mac .l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.bar{height:6px;border-radius:99px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.meal{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}
.meal b{font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--s1);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.row:hover{background:var(--s2)}
.row .n{flex:1;min-width:0}.row .n div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k{text-align:right;font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--muted);font-size:18px;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad)}
.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:13px}
.stat .v{font-size:22px;font-weight:620;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{background:none;border:0;padding:5px 11px;border-radius:8px;color:var(--muted);font-size:13px}
.seg button.on{background:var(--s2);color:var(--text)}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart{width:100%;height:auto;display:block}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--s2);gap:2px}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);text-align:right;padding:6px 4px;font-size:12px}
td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.pos{color:var(--warn)}.neg{color:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(14,15,17,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.tabs button{background:none;border:0;color:var(--muted);padding:7px 0;border-radius:10px;font-size:11px;display:grid;gap:2px;justify-items:center}
nav.tabs button span{font-size:18px;line-height:1}
nav.tabs button.on{color:var(--accent);background:var(--s1)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:none;align-items:flex-end;justify-content:center}
#ov.open{display:flex}
#sheet{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){#ov{align-items:center}#sheet{border-radius:20px}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--s1);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:5px 12px;font-size:12.5px}
.chip.on{color:#08110b;background:var(--accent);border-color:var(--accent)}
.qty{display:grid;grid-template-columns:40px 1fr 40px;gap:8px}
.pv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin:14px 0}
.pv div{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.pv b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.pv span{font-size:11px;color:var(--muted)}
#tip{position:fixed;z-index:20;pointer-events:none;background:#000;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;display:none;white-space:pre;line-height:1.5}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;z-index:30;display:none;gap:12px;align-items:center;font-size:13px}
#toast button{background:none;border:0;color:var(--accent);font-weight:600}
.note{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>

let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r){const d=defaults();return{...d,...r,settings:{...d.settings,...r.settings}}}}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save — storage is full or blocked')}}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const today=()=>ds(new Date());
const weekStart=s=>{const d=pd(s);return addDays(s,-((d.getDay()+6)%7))};
const monthKey=s=>s.slice(0,7);
const daysInMonth=k=>new Date(+k.slice(0,4),+k.slice(5,7),0).getDate();
const addMonths=(k,n)=>{const d=new Date(+k.slice(0,4),+k.slice(5,7)-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const short=s=>{const d=pd(s);return `${d.getDate()} ${MON[d.getMonth()]}`};
const long=s=>{const d=pd(s);return `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''}`};
const r0=n=>Math.round(n).toLocaleString(),r1=n=>(Math.round(n*10)/10).toString();
const sum=a=>a.reduce((x,y)=>x+y,0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const toDisp=kg=>S.settings.unit==='lb'?kg*2.20462:kg;
const toKg=v=>S.settings.unit==='lb'?v/2.20462:v;
const fw=kg=>r1(toDisp(kg))+' '+S.settings.unit;

const allFoods=()=>[...S.foods,...BUILTIN];
const findFood=id=>allFoods().find(f=>f.id===id);
function unitsOf(f){
  const u=[{n:'g',g:1},{n:'oz',g:28.35}];
  (f.u||'').split(';').filter(Boolean).forEach(p=>{const [n,g]=p.split('=');if(n&&+g>0&&!u.some(x=>x.n===n))u.push({n,g:+g})});
  return u;
}
function calc(f,qty,unit){
  const u=unitsOf(f).find(x=>x.n===unit)||{g:1};
  const g=qty*u.g,k=g/100;
  return{g,kcal:f.n[0]*k,p:f.n[1]*k,c:f.n[2]*k,f:f.n[3]*k};
}

/* Totals per date, built once per render */
function totalsMap(){
  const m={};
  for(const e of S.log){const t=m[e.date]||(m[e.date]={kcal:0,p:0,c:0,f:0,n:0});t.kcal+=e.kcal;t.p+=e.p;t.c+=e.c;t.f+=e.f;t.n++}
  return m;
}
const ZERO={kcal:0,p:0,c:0,f:0,n:0};

/* Profile maths */
function latestWeight(upTo){
  const ks=Object.keys(S.weights).filter(k=>!upTo||k<=upTo).sort();
  return ks.length?{date:ks[ks.length-1],kg:S.weights[ks[ks.length-1]]}:null;
}
function tdee(){
  const s=S.settings,w=latestWeight();
  if(!w||!s.age||!s.height)return null;
  const bmr=10*w.kg+6.25*s.height-5*s.age+(s.sex==='male'?5:-161);
  return bmr*s.activity;
}
function suggestTarget(){
  const t=tdee();if(!t)return null;
  const s=S.settings,delta=s.goal==='lose'?-s.rate:s.goal==='gain'?s.rate:0;
  return Math.max(1200,Math.round((t+delta*7700/7)/10)*10);
}
function onTarget(kcal){
  const t=S.settings.target,g=S.settings.goal;
  if(g==='lose')return kcal<=t*1.02;
  if(g==='gain')return kcal>=t*0.98;
  return Math.abs(kcal-t)<=t*0.1;
}

/* ---------- UI state ---------- */
const U={tab:'today',date:today(),week:today(),month:monthKey(today()),wRange:90,fq:'',fcat:'All'};
const TABS=[['today','◔','Today'],['week','▤','Weekly'],['month','▦','Monthly'],['weight','⚖','Weight'],['foods','🍎','Foods'],['settings','⚙','Settings']];

function render(){
  $('#tabs').innerHTML=TABS.map(([k,i,l])=>`<button class="${U.tab===k?'on':''}" data-act="tab" data-v="${k}"><span>${i}</span>${l}</button>`).join('');
  const T=totalsMap();
  $('#app').innerHTML=({today:vToday,week:vWeek,month:vMonth,weight:vWeight,foods:vFoods,settings:vSettings}[U.tab])(T);
  if(U.tab==='foods')renderFoodList();
}

/* ---------- Today ---------- */
function ring(val,target,color){
  const R=54,C=2*Math.PI*R,pct=target>0?Math.min(val/target,1):0;
  return `<svg viewBox="0 0 132 132" width="132" height="132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--s2)" stroke-width="11"/>
  <circle cx="66" cy="66" r="${R}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 66 66)"/></svg>`;
}
function vToday(T){
  const d=U.date,t=T[d]||ZERO,target=S.settings.target,left=target-t.kcal;
  const over=left<0,color=over&&S.settings.goal==='lose'?'var(--warn)':'var(--accent)';
  const w=S.weights[d],macroKcal=t.p*4+t.c*4+t.f*9||1;
  const mac=(n,v,c)=>`<div class="mac"><div class="l"><span>${n}</span><span class="muted">${r0(v)} g · ${Math.round(v*(n==='Fat'?9:4)/macroKcal*100)}%</span></div><div class="bar"><i style="width:${Math.min(100,v*(n==='Fat'?9:4)/macroKcal*100)}%;background:${c}"></i></div></div>`;
  const meals=MEALS.map(m=>{
    const es=S.log.filter(e=>e.date===d&&e.meal===m);
    return `<div class="meal"><div><b>${m}</b> <span class="muted sm">${es.length?r0(sum(es.map(e=>e.kcal)))+' kcal':''}</span></div><button class="btn" data-act="add" data-meal="${m}">+ Add</button></div>`+
      (es.length?es.map(e=>`<div class="row" data-act="edit" data-id="${e.id}"><div class="n"><div>${esc(e.name)}</div><div class="muted sm">${r1(e.qty)} ${esc(e.unit)}${e.unit!=='g'?` · ${r0(e.g)} g`:''} · P ${r0(e.p)} C ${r0(e.c)} F ${r0(e.f)}</div></div><div class="k">${r0(e.kcal)}<div class="muted sm">kcal</div></div><button class="x" data-act="del" data-id="${e.id}" title="Remove">×</button></div>`).join(''):`<div class="empty">Nothing logged</div>`);
  }).join('');
  return `<div class="top"><h1>${d===today()?'Today':long(d)}</h1><div class="nav">
    <button class="ib" data-act="dprev">‹</button><button class="btn" data-act="dtoday">${d===today()?long(d):'Today'}</button><button class="ib" data-act="dnext">›</button></div></div>
  <div class="card hero"><div class="ring">${ring(t.kcal,target,color)}<div class="mid"><div class="big">${r0(Math.abs(left))}</div><div class="muted sm">${over?'kcal over':'kcal left'}</div></div></div>
  <div class="macros"><div class="sm muted">${r0(t.kcal)} of ${r0(target)} kcal</div>${mac('Protein',t.p,'var(--p)')}${mac('Carbs',t.c,'var(--c)')}${mac('Fat',t.f,'var(--f)')}</div></div>
  <div class="card" style="margin-top:12px"><div style="display:flex;gap:10px;align-items:end"><div style="flex:1"><label>Body weight (${S.settings.unit}) — ${long(d)}</label>
  <input id="wd" type="number" step="0.1" inputmode="decimal" placeholder="e.g. ${S.settings.unit==='kg'?'70.5':'155.0'}" value="${w?r1(toDisp(w)):''}"></div><button class="btn" data-act="wsave" data-date="${d}">Save</button></div></div>
  ${meals}`;
}

/* ---------- Charts (inline SVG) ---------- */
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1))),n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function barChart(days,target){
  const W=640,H=230,L=42,R=8,Tp=12,B=28,n=days.length;
  const max=niceMax(Math.max(target*1.15,...days.map(d=>d.v),100)),iw=W-L-R,ih=H-Tp-B,bw=iw/n,y=v=>Tp+ih-(v/max)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){const v=max/4*i;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${r0(v)}</text>`}
  const step=n>12?Math.ceil(n/10):1;
  days.forEach((d,i)=>{
    const x=L+i*bw,w=Math.max(3,bw*(n>12?0.68:0.58)),bx=x+(bw-w)/2;
    if(d.v>0)s+=`<rect data-tip="${esc(d.tip)}" x="${bx}" y="${y(d.v)}" width="${w}" height="${ih+Tp-y(d.v)}" rx="${Math.min(5,w/2)}" fill="${onTarget(d.v)?'var(--accent)':'var(--warn)'}"/>`;
    else s+=`<rect data-tip="${esc(d.tip)}" x="${bx}" y="${Tp+ih-3}" width="${w}" height="3" rx="1.5" fill="var(--line)"/>`;
    if(i%step===0)s+=`<text x="${x+bw/2}" y="${H-9}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--p)" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(target)-5}" text-anchor="end" style="fill:var(--p)">target ${r0(target)}</text></svg>`;
  return s;
}
function lineChart(pts,from,to,goalKg){
  const W=640,H=210,L=42,R=10,Tp=14,B=26;
  if(!pts.length)return `<div class="empty">No weight entries in this period</div>`;
  const vals=pts.map(p=>toDisp(p.kg));if(goalKg)vals.push(toDisp(goalKg));
  let lo=Math.min(...vals),hi=Math.max(...vals);const padv=Math.max(0.5,(hi-lo)*0.2);lo-=padv;hi+=padv;
  const t0=pd(from).getTime(),t1=pd(to).getTime()||t0+1,iw=W-L-R,ih=H-Tp-B;
  const x=d=>L+(t1===t0?iw/2:(pd(d).getTime()-t0)/(t1-t0)*iw),y=v=>Tp+ih-(v-lo)/(hi-lo)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=3;i++){const v=lo+(hi-lo)/3*i;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${r1(v)}</text>`}
  s+=`<text x="${L}" y="${H-7}">${short(from)}</text><text x="${W-R}" y="${H-7}" text-anchor="end">${short(to)}</text>`;
  if(goalKg)s+=`<line x1="${L}" x2="${W-R}" y1="${y(toDisp(goalKg))}" y2="${y(toDisp(goalKg))}" stroke="var(--c)" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(toDisp(goalKg))-5}" text-anchor="end" style="fill:var(--c)">goal ${r1(toDisp(goalKg))}</text>`;
  s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+x(p.date).toFixed(1)+' '+y(toDisp(p.kg)).toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach(p=>s+=`<circle data-tip="${esc(short(p.date)+'\n'+fw(p.kg))}" cx="${x(p.date)}" cy="${y(toDisp(p.kg))}" r="${pts.length>40?2.5:4}" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/>`);
  return s+'</svg>';
}
const macroSplit=(p,c,f)=>{
  const a=p*4,b=c*4,d=f*9,t=a+b+d;if(!t)return '';
  const pc=v=>Math.round(v/t*100);
  return `<div class="split"><i style="width:${a/t*100}%;background:var(--p)"></i><i style="width:${b/t*100}%;background:var(--c)"></i><i style="width:${d/t*100}%;background:var(--f)"></i></div>
  <div class="legend"><span><b style="background:var(--p)"></b>Protein ${pc(a)}% · ${r0(p)} g</span><span><b style="background:var(--c)"></b>Carbs ${pc(b)}% · ${r0(c)} g</span><span><b style="background:var(--f)"></b>Fat ${pc(d)}% · ${r0(f)} g</span></div>`;
};

/* ---------- Weekly / Monthly reports ---------- */
function weightsIn(a,b){return Object.keys(S.weights).filter(k=>k>=a&&k<=b).sort().map(k=>({date:k,kg:S.weights[k]}))}
function statCard(v,l,cls=''){return `<div class="card stat"><div class="v ${cls}">${v}</div><div class="l">${l}</div></div>`}
function summary(T,dates){
  const rows=dates.map(d=>({d,...(T[d]||ZERO)})),logged=rows.filter(r=>r.n>0);
  const tot=k=>sum(logged.map(r=>r[k])),nl=logged.length;
  const avg=nl?tot('kcal')/nl:0,td=tdee(),tgt=S.settings.target;
  const ok=logged.filter(r=>onTarget(r.kcal)).length;
  const ws=weightsIn(dates[0],dates[dates.length-1]);
  const wd=ws.length>1?ws[ws.length-1].kg-ws[0].kg:null;
  let est='';
  if(nl&&td){const e=(avg-td)*7/7700;est=`<div class="note">At an average of ${r0(avg)} kcal/day vs. an estimated maintenance of ${r0(td)}, expected change ≈ <b>${e>0?'+':''}${r1(toDisp(e))} ${S.settings.unit}/week</b> (estimate only).</div>`}
  const html=`<div class="grid g4" style="margin-top:12px">
    ${statCard(nl?r0(avg):'—','Avg kcal / logged day')}
    ${statCard(r0(tot('kcal')),'Total kcal')}
    ${statCard(`${ok}/${nl}`,'Days on target')}
    ${statCard(wd===null?'—':(wd>0?'+':'')+r1(toDisp(wd)),'Weight change ('+S.settings.unit+')',wd===null?'':(S.settings.goal==='lose'?wd<=0:S.settings.goal==='gain'?wd>=0:true)?'neg':'pos')}
  </div>
  <div class="card" style="margin-top:12px"><div class="muted sm" style="margin-bottom:8px">Average macros per logged day · ${nl} of ${dates.length} days logged</div>${nl?macroSplit(tot('p')/nl,tot('c')/nl,tot('f')/nl):'<div class="empty">No food logged in this period</div>'}${est}</div>`;
  return{html,rows,ws,tgt};
}
function vWeek(T){
  const a=weekStart(U.week),dates=Array.from({length:7},(_,i)=>addDays(a,i)),b=dates[6];
  const sm=summary(T,dates);
  const bars=dates.map(d=>{const t=T[d]||ZERO;return{label:DOW[pd(d).getDay()],v:t.kcal,tip:`${long(d)}\n${r0(t.kcal)} kcal\nP ${r0(t.p)}  C ${r0(t.c)}  F ${r0(t.f)}`}});
  return `<div class="top"><h1>Weekly summary</h1><div class="nav"><button class="ib" data-act="wprev">‹</button><button class="btn" data-act="wcur">${short(a)} – ${short(b)}</button><button class="ib" data-act="wnext">›</button></div></div>
  <div class="card"><div class="muted sm" style="margin-bottom:6px">Calories per day</div>${barChart(bars,S.settings.target)}</div>
  ${sm.html}
  <h2>Weight</h2><div class="card">${lineChart(sm.ws,a,b,S.settings.goalWeight)}</div>
  <h2>Daily breakdown</h2><div class="card"><table><tr><th>Day</th><th>kcal</th><th>P</th><th>C</th><th>F</th><th>vs target</th></tr>
  ${sm.rows.map(r=>{const df=r.kcal-sm.tgt;return `<tr><td>${DOW[pd(r.d).getDay()]} ${pd(r.d).getDate()}</td><td>${r.n?r0(r.kcal):'–'}</td><td>${r.n?r0(r.p):'–'}</td><td>${r.n?r0(r.c):'–'}</td><td>${r.n?r0(r.f):'–'}</td><td class="${r.n?(onTarget(r.kcal)?'neg':'pos'):''}">${r.n?(df>0?'+':'')+r0(df):'–'}</td></tr>`}).join('')}</table></div>`;
}
function vMonth(T){
  const k=U.month,n=daysInMonth(k),dates=Array.from({length:n},(_,i)=>`${k}-${pad(i+1)}`);
  const sm=summary(T,dates),label=`${MON[+k.slice(5,7)-1]} ${k.slice(0,4)}`;
  const bars=dates.map(d=>{const t=T[d]||ZERO;return{label:String(pd(d).getDate()),v:t.kcal,tip:`${long(d)}\n${r0(t.kcal)} kcal\nP ${r0(t.p)}  C ${r0(t.c)}  F ${r0(t.f)}`}});
  const weeks=[];let ws=weekStart(dates[0]);
  while(ws<=dates[n-1]){
    const wd=Array.from({length:7},(_,i)=>addDays(ws,i)).filter(d=>d>=dates[0]&&d<=dates[n-1]);
    const lg=wd.filter(d=>T[d]),w=weightsIn(wd[0],wd[wd.length-1]);
    weeks.push({label:`${short(wd[0])} – ${short(wd[wd.length-1])}`,avg:lg.length?sum(lg.map(d=>T[d].kcal))/lg.length:0,n:lg.length,
      w:w.length?w[w.length-1].kg:null});
    ws=addDays(ws,7);
  }
  return `<div class="top"><h1>Monthly summary</h1><div class="nav"><button class="ib" data-act="mprev">‹</button><button class="btn" data-act="mcur">${label}</button><button class="ib" data-act="mnext">›</button></div></div>
  <div class="card"><div class="muted sm" style="margin-bottom:6px">Calories per day</div>${barChart(bars,S.settings.target)}</div>
  ${sm.html}
  <h2>Weight</h2><div class="card">${lineChart(sm.ws,dates[0],dates[n-1],S.settings.goalWeight)}</div>
  <h2>Week by week</h2><div class="card"><table><tr><th>Week</th><th>Days</th><th>Avg kcal</th><th>vs target</th><th>Weight</th></tr>
  ${weeks.map(w=>{const df=w.avg-sm.tgt;return `<tr><td>${w.label}</td><td>${w.n}</td><td>${w.n?r0(w.avg):'–'}</td><td class="${w.n?(onTarget(w.avg)?'neg':'pos'):''}">${w.n?(df>0?'+':'')+r0(df):'–'}</td><td>${w.w?r1(toDisp(w.w)):'–'}</td></tr>`}).join('')}</table></div>`;
}

/* ---------- Weight ---------- */
function vWeight(){
  const keys=Object.keys(S.weights).sort(),cur=latestWeight(),first=keys.length?{date:keys[0],kg:S.weights[keys[0]]}:null,gw=S.settings.goalWeight;
  const to=today(),from=U.wRange?addDays(to,-U.wRange):(keys[0]||to);
  const pts=weightsIn(from,to);
  let prog='';
  if(first&&cur&&gw){
    const tot=first.kg-gw,done=first.kg-cur.kg,pct=tot===0?100:Math.max(0,Math.min(100,done/tot*100));
    prog=`<div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between" class="sm"><span class="muted">Progress to goal (${fw(gw)})</span><b>${Math.round(pct)}%</b></div><div class="bar" style="height:8px;margin-top:8px"><i style="width:${pct}%;background:var(--accent)"></i></div>
    <div class="note">${Math.abs(cur.kg-gw)<0.05?'Goal reached 🎉':`${fw(Math.abs(cur.kg-gw))} to ${cur.kg>gw?'lose':'gain'}`}</div></div>`;
  }else if(!gw)prog=`<div class="note" style="margin:10px 0">Set a goal weight in Settings to see progress.</div>`;
  return `<div class="top"><h1>Weight</h1><div class="seg">${[[30,'30d'],[90,'90d'],[365,'1y'],[0,'All']].map(([v,l])=>`<button class="${U.wRange===v?'on':''}" data-act="wrange" data-v="${v}">${l}</button>`).join('')}</div></div>
  <div class="grid g3"><div class="card stat"><div class="v">${first?r1(toDisp(first.kg)):'—'}</div><div class="l">Start</div></div>
  <div class="card stat"><div class="v">${cur?r1(toDisp(cur.kg)):'—'}</div><div class="l">Current (${S.settings.unit})</div></div>
  <div class="card stat"><div class="v">${first&&cur?((cur.kg-first.kg>0?'+':'')+r1(toDisp(cur.kg-first.kg))):'—'}</div><div class="l">Change</div></div></div>
  ${prog}
  <div class="card" style="margin-top:12px">${lineChart(pts,from,to,gw)}</div>
  <div class="card" style="margin-top:12px"><div style="display:flex;gap:10px;align-items:end"><div style="flex:1"><label>Date</label><input id="wdate" type="date" value="${today()}"></div>
  <div style="flex:1"><label>Weight (${S.settings.unit})</label><input id="wnew" type="number" step="0.1" inputmode="decimal"></div><button class="btn pri" data-act="wadd">Log</button></div></div>
  <h2>History</h2>${keys.length?[...keys].reverse().slice(0,60).map(k=>`<div class="row" style="cursor:default"><div class="n">${long(k)}</div><div class="k">${fw(S.weights[k])}</div><button class="x" data-act="wdel" data-date="${k}">×</button></div>`).join(''):`<div class="empty">No weigh-ins yet</div>`}`;
}

/* ---------- Foods tab ---------- */
function vFoods(){
  return `<div class="top"><h1>Food database</h1><button class="btn pri" data-act="newfood">+ Custom food</button></div>
  <input id="fq" placeholder="Search ${BUILTIN.length+S.foods.length} foods…" value="${esc(U.fq)}" autocomplete="off">
  <div class="chips">${['All','Custom',...CATS].map(c=>`<button class="chip ${U.fcat===c?'on':''}" data-act="fcat" data-v="${esc(c)}">${c}</button>`).join('')}</div>
  <div id="flist"></div>`;
}
function filterFoods(q,cat){
  q=q.trim().toLowerCase();
  return allFoods().filter(f=>(cat==='All'||(cat==='Custom'?f.id[0]==='c':f.cat===cat))&&(!q||f.name.toLowerCase().includes(q)));
}
function foodRow(f,act){
  return `<div class="row" data-act="${act}" data-fid="${f.id}"><div class="n"><div>${esc(f.name)}</div><div class="muted sm">${esc(f.cat)} · per 100 g: P ${r1(f.n[1])} C ${r1(f.n[2])} F ${r1(f.n[3])}</div></div><div class="k">${r0(f.n[0])}<div class="muted sm">kcal/100g</div></div></div>`;
}
function renderFoodList(){
  const el=$('#flist');if(!el)return;
  const fs=filterFoods(U.fq,U.fcat);
  el.innerHTML=fs.length?fs.map(f=>f.id[0]==='c'
    ?`<div class="row" data-act="editfood" data-fid="${f.id}"><div class="n"><div>${esc(f.name)} <span class="muted sm">· custom</span></div><div class="muted sm">per 100 g: P ${r1(f.n[1])} C ${r1(f.n[2])} F ${r1(f.n[3])}</div></div><div class="k">${r0(f.n[0])}<div class="muted sm">kcal/100g</div></div></div>`
    :foodRow(f,'foodinfo')).join(''):`<div class="empty">No foods match. Create a custom food to add your own.</div>`;
}

/* ---------- Settings ---------- */
function vSettings(){
  const s=S.settings,sg=suggestTarget(),td=tdee();
  const sel=(k,opts)=>`<select data-set="${k}">${opts.map(([v,l])=>`<option value="${v}" ${String(s[k])===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
  const num=(k,step='1')=>`<input data-set="${k}" type="number" step="${step}" inputmode="decimal" value="${s[k]??''}">`;
  return `<div class="top"><h1>Settings</h1></div>
  <div class="card"><div class="grid g2">
   <div><label>Weight unit</label>${sel('unit',[['kg','Kilograms (kg)'],['lb','Pounds (lb)']])}</div>
   <div><label>Goal</label>${sel('goal',[['lose','Lose weight'],['maintain','Maintain weight'],['gain','Gain weight']])}</div>
   <div><label>Goal weight (${s.unit})</label><input data-set="goalWeight" data-w="1" type="number" step="0.1" inputmode="decimal" value="${s.goalWeight?r1(toDisp(s.goalWeight)):''}"></div>
   <div><label>Pace (kg per week)</label>${sel('rate',[[0.25,'0.25 — gentle'],[0.5,'0.5 — steady'],[0.75,'0.75 — fast'],[1,'1.0 — aggressive']])}</div></div></div>
  <h2>Profile (for calorie suggestion)</h2>
  <div class="card"><div class="grid g2">
   <div><label>Sex</label>${sel('sex',[['male','Male'],['female','Female']])}</div><div><label>Age</label>${num('age')}</div>
   <div><label>Height (cm)</label>${num('height')}</div>
   <div><label>Activity</label>${sel('activity',[[1.2,'Sedentary'],[1.375,'Light (1–3×/wk)'],[1.55,'Moderate (3–5×/wk)'],[1.725,'Very active (6–7×/wk)'],[1.9,'Athlete / physical job']])}</div></div>
   <div class="note">${td?`Estimated maintenance: <b>${r0(td)} kcal/day</b> (Mifflin-St Jeor, using your latest weigh-in). Suggested target for your goal: <b>${r0(sg)} kcal</b>.`:'Log a weigh-in to get a maintenance estimate.'}</div></div>
  <h2>Daily calorie target</h2>
  <div class="card"><div style="display:flex;gap:10px;align-items:end"><div style="flex:1"><label>Target (kcal)</label>${num('target','10')}</div><button class="btn" data-act="suggest" ${sg?'':'disabled'}>Use suggestion</button></div></div>
  <h2>Data</h2>
  <div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="export">Export backup</button><label class="btn" style="margin:0;color:var(--text)">Import backup<input id="imp" type="file" accept="application/json" hidden></label><button class="btn danger" data-act="reset">Erase all data</button></div>
  <div class="note">Everything is stored locally in this browser. Export a backup to move it between devices.</div></div>
  <div class="note" style="margin-top:14px">Nutrition values are typical averages and meant as estimates. This app is not medical advice.</div>`;
}

/* ---------- Bottom sheet: add / edit food ---------- */
let A=null; // add-flow state
const sheet=html=>{$('#sheet').innerHTML=html;$('#ov').classList.add('open')};
const closeSheet=()=>{$('#ov').classList.remove('open');A=null};

function openAdd(meal,editId){
  if(editId){
    const e=S.log.find(x=>x.id===editId);if(!e)return;
    A={food:{id:e.foodId,name:e.name,n:e.n,u:e.u,cat:''},qty:e.qty,unit:e.unit,meal:e.meal,editId};
    return sheetDetail();
  }
  A={meal,q:'',cat:'All',qty:1,unit:'g'};
  sheetSearch();
}
function sheetSearch(){
  sheet(`<div class="top"><h1>Add to ${esc(A.meal)}</h1><button class="ib" data-act="close">✕</button></div>
  <input id="aq" placeholder="Search foods or ingredients…" autocomplete="off" value="${esc(A.q)}">
  <div class="chips">${['All','Recent','Custom',...CATS].map(c=>`<button class="chip ${A.cat===c?'on':''}" data-act="acat" data-v="${esc(c)}">${c}</button>`).join('')}</div>
  <div id="ares"></div>
  <button class="btn block" data-act="newfood" style="margin-top:8px">+ Create custom food</button>`);
  renderAres();
  if(matchMedia('(hover:hover)').matches)$('#aq').focus();
}
function renderAres(){
  let fs;
  if(A.cat==='Recent')fs=S.recent.map(findFood).filter(Boolean).filter(f=>!A.q||f.name.toLowerCase().includes(A.q.toLowerCase()));
  else fs=filterFoods(A.q,A.cat);
  const more=fs.length>60;
  $('#ares').innerHTML=fs.length?fs.slice(0,60).map(f=>foodRow(f,'pick')).join('')+(more?`<div class="note" style="text-align:center">Showing 60 of ${fs.length} — keep typing to narrow down.</div>`:''):`<div class="empty">${A.cat==='Recent'?'No recent foods yet':'No matches'}</div>`;
}
function pick(id){
  const f=findFood(id);if(!f)return;
  const us=unitsOf(f);
  A.food=f;A.qty=1;A.unit=us.length>2?us[2].n:'g';
  if(A.unit==='g')A.qty=100;
  sheetDetail();
}
function sheetDetail(){
  const f=A.food,us=unitsOf(f);
  sheet(`<div class="top"><h1>${A.editId?'Edit entry':'Add food'}</h1><button class="ib" data-act="close">✕</button></div>
  <div class="card"><b>${esc(f.name)}</b><div class="muted sm">Per 100 g: ${r0(f.n[0])} kcal · P ${r1(f.n[1])} · C ${r1(f.n[2])} · F ${r1(f.n[3])}</div></div>
  <div style="margin-top:14px"><label>Amount</label><div class="qty"><button class="ib" style="width:40px;height:40px" data-act="qstep" data-v="-1">−</button>
   <input id="aqty" type="number" min="0" step="any" inputmode="decimal" value="${A.qty}"><button class="ib" style="width:40px;height:40px" data-act="qstep" data-v="1">+</button></div></div>
  <div class="grid g2" style="margin-top:12px"><div><label>Measure</label><select id="aunit">${us.map(u=>`<option value="${esc(u.n)}" ${u.n===A.unit?'selected':''}>${esc(u.n)}${u.g!==1&&u.n!=='oz'?` (${u.g} g)`:''}</option>`).join('')}</select></div>
   <div><label>Meal</label><select id="ameal">${MEALS.map(m=>`<option ${m===A.meal?'selected':''}>${m}</option>`).join('')}</select></div></div>
  <div class="pv" id="apv"></div>
  <button class="btn pri block" data-act="asave">${A.editId?'Save changes':'Add to '+esc(A.meal)}</button>`);
  updPv();
}
function updPv(){
  const c=calc(A.food,+A.qty||0,A.unit);
  $('#apv').innerHTML=`<div><b>${r0(c.kcal)}</b><span>kcal</span></div><div><b style="color:var(--p)">${r1(c.p)}</b><span>protein g</span></div><div><b style="color:var(--c)">${r1(c.c)}</b><span>carbs g</span></div><div><b style="color:var(--f)">${r1(c.f)}</b><span>fat g</span></div>
  <div style="grid-column:1/-1;background:none;border:0;padding:0" class="muted sm">= ${r1(c.g)} g total</div>`;
}
function saveEntry(){
  const qty=+A.qty;if(!(qty>0)){toast('Enter an amount greater than 0');return}
  const f=A.food,c=calc(f,qty,A.unit);
  const base={foodId:f.id,name:f.name,n:f.n,u:f.u,qty,unit:A.unit,meal:A.meal,g:c.g,kcal:c.kcal,p:c.p,c:c.c,f:c.f};
  if(A.editId){Object.assign(S.log.find(x=>x.id===A.editId),base)}
  else{
    S.log.push({id:uid(),date:U.date,...base});
    S.recent=[f.id,...S.recent.filter(x=>x!==f.id)].slice(0,20);
  }
  save();closeSheet();render();
}

/* Custom food form */
let CF=null;
function foodForm(f){
  CF={id:f?.id,fromAdd:!!A&&!f};
  const n=f?.n||['','','',''],sv=(f?.u||'').split(';')[0]?.split('=')||[];
  sheet(`<div class="top"><h1>${f?'Edit':'New'} custom food</h1><button class="ib" data-act="close">✕</button></div>
  <div class="grid"><div><label>Name</label><input id="cfn" value="${esc(f?.name||'')}" placeholder="e.g. Mom's chicken curry"></div>
  <div><label>Category</label><select id="cfc">${CATS.map(c=>`<option ${f?.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="muted sm">Nutrition per 100 g</div>
  <div class="grid g4"><div><label>kcal</label><input id="cfk" type="number" step="any" value="${n[0]}"></div><div><label>Protein g</label><input id="cfp" type="number" step="any" value="${n[1]}"></div>
  <div><label>Carbs g</label><input id="cfcb" type="number" step="any" value="${n[2]}"></div><div><label>Fat g</label><input id="cff" type="number" step="any" value="${n[3]}"></div></div>
  <div class="muted sm">Optional serving size</div>
  <div class="grid g2"><div><label>Serving name</label><input id="cfs" value="${esc(sv[0]||'')}" placeholder="bowl, piece, scoop…"></div><div><label>Grams per serving</label><input id="cfg" type="number" step="any" value="${sv[1]||''}"></div></div>
  <button class="btn pri block" data-act="savefood">Save food</button>
  ${f?`<button class="btn danger block" data-act="delfood" data-fid="${f.id}">Delete food</button>`:''}</div>`);
}
function saveFood(){
  const name=$('#cfn').value.trim(),v=id=>+$(id).value||0;
  if(!name){toast('Give the food a name');return}
  const n=[v('#cfk'),v('#cfp'),v('#cfcb'),v('#cff')];
  if(n[0]<=0&&n.slice(1).every(x=>x<=0)&&name.toLowerCase()!=='water'){toast('Enter the nutrition values');return}
  const sn=$('#cfs').value.trim().replace(/[=;]/g,''),sg=v('#cfg');
  const food={id:CF.id||'c'+uid(),name,cat:$('#cfc').value,n,u:sn&&sg>0?`${sn}=${sg}`:''};
  const i=S.foods.findIndex(x=>x.id===food.id);
  if(i>=0)S.foods[i]=food;else S.foods.unshift(food);
  save();
  if(CF.fromAdd){pick(food.id)}else{closeSheet();render()}
}

/* ---------- Toast / tooltip ---------- */
let toastT;
function toast(msg,undo){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}`;t.style.display='flex';
  clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',4500);
}
let lastDel=null;
function tipShow(e){
  const t=e.target.closest?.('[data-tip]'),tip=$('#tip');
  if(!t){tip.style.display='none';return}
  tip.textContent=t.dataset.tip;tip.style.display='block';
  const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,Math.max(8,e.clientX-w/2))+'px';tip.style.top=Math.max(8,e.clientY-tip.offsetHeight-14)+'px';
}
document.addEventListener('pointermove',tipShow);
document.addEventListener('click',tipShow);
document.addEventListener('scroll',()=>$('#tip').style.display='none',true);

/* ---------- Actions ---------- */
const ACT={
  tab:t=>{U.tab=t.dataset.v;render();scrollTo(0,0)},
  dprev:()=>{U.date=addDays(U.date,-1);render()},dnext:()=>{U.date=addDays(U.date,1);render()},dtoday:()=>{U.date=today();render()},
  wprev:()=>{U.week=addDays(U.week,-7);render()},wnext:()=>{U.week=addDays(U.week,7);render()},wcur:()=>{U.week=today();render()},
  mprev:()=>{U.month=addMonths(U.month,-1);render()},mnext:()=>{U.month=addMonths(U.month,1);render()},mcur:()=>{U.month=monthKey(today());render()},
  wrange:t=>{U.wRange=+t.dataset.v;render()},
  add:t=>openAdd(t.dataset.meal),
  edit:t=>openAdd(null,t.dataset.id),
  del:(t,e)=>{
    e.stopPropagation();const i=S.log.findIndex(x=>x.id===t.dataset.id);if(i<0)return;
    lastDel=S.log.splice(i,1)[0];save();render();toast('Entry removed',true);
  },
  undo:()=>{if(lastDel){S.log.push(lastDel);lastDel=null;save();render();$('#toast').style.display='none'}},
  close:closeSheet,
  acat:t=>{A.cat=t.dataset.v;sheetSearch()},
  pick:t=>pick(t.dataset.fid),
  qstep:t=>{const u=A.unit,step=u==='g'||u==='ml'?10:u==='oz'?0.5:0.5;A.qty=Math.max(0,Math.round((+A.qty+ +t.dataset.v*step)*100)/100);$('#aqty').value=A.qty;updPv()},
  asave:saveEntry,
  newfood:()=>foodForm(null),
  editfood:t=>foodForm(S.foods.find(f=>f.id===t.dataset.fid)),
  savefood:saveFood,
  delfood:t=>{if(confirm('Delete this custom food? Past log entries are kept.')){S.foods=S.foods.filter(f=>f.id!==t.dataset.fid);save();closeSheet();render()}},
  foodinfo:t=>{A={meal:guessMeal(),q:'',cat:'All'};pick(t.dataset.fid)},
  fcat:t=>{U.fcat=t.dataset.v;render()},
  wsave:t=>{const v=parseFloat($('#wd').value);if(!(v>0)){delete S.weights[t.dataset.date]}else S.weights[t.dataset.date]=toKg(v);save();render();toast('Weight saved')},
  wadd:()=>{const v=parseFloat($('#wnew').value),d=$('#wdate').value;if(!(v>0)||!d){toast('Enter a date and weight');return}S.weights[d]=toKg(v);save();render()},
  wdel:t=>{delete S.weights[t.dataset.date];save();render()},
  suggest:()=>{const s=suggestTarget();if(s){S.settings.target=s;save();render();toast('Target set to '+r0(s)+' kcal')}},
  export:()=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
    a.download=`calorie-tracker-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },
  reset:()=>{if(confirm('Erase ALL logged food, weights, custom foods and settings? This cannot be undone.')){S=defaults();save();render()}}
};
function guessMeal(){const h=new Date().getHours();return h<11?'Breakfast':h<15?'Lunch':h<21?'Dinner':'Snacks'}
document.addEventListener('click',e=>{
  if(e.target.id==='ov')return closeSheet();
  const t=e.target.closest('[data-act]');if(t)ACT[t.dataset.act]?.(t,e);
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='aq'){A.q=e.target.value;renderAres()}
  else if(id==='aqty'){A.qty=e.target.value;updPv()}
  else if(id==='fq'){U.fq=e.target.value;renderFoodList()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='aunit'){A.unit=t.value;updPv()}
  else if(t.id==='ameal')A.meal=t.value;
  else if(t.id==='imp'){
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.log)||typeof d.weights!=='object')throw 0;
      const b=defaults();S={...b,...d,settings:{...b.settings,...d.settings}};save();render();toast('Backup imported')}catch(_){toast('That file is not a valid backup')}};
    r.readAsText(t.files[0]);
  }
  else if(t.dataset.set){
    const k=t.dataset.set;let v=t.value;
    if(['unit','sex','goal'].includes(k))S.settings[k]=v;
    else if(t.dataset.w)S.settings[k]=+v>0?toKg(+v):null;
    else S.settings[k]=+v>0?+v:S.settings[k];
    save();render();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

render();
</script>
</body>
</html>
